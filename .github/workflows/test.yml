name: Test & Quality Checks

on:
  pull_request:
    branches: [main, h3]
  push:
    branches: [main, h3]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
          POSTGRES_DB: eve_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: backend
        run: npm run db:generate
        
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eve:eve@localhost:5432/eve_test
        run: npx prisma migrate deploy
      
      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eve:eve@localhost:5432/eve_test
          JWT_ACCESS_SECRET: test-secret-key-for-ci-only
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_CLIENT_ID: test-client-id
        run: npm run test:coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  backend-lint:
    name: Backend Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eve:eve@localhost:5432/eve_test
        run: npm run db:generate
      
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit
      
      - name: Validate Prisma schema
        working-directory: backend
        run: npm run db:validate

  rider-lint:
    name: Rider App Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: rider/package-lock.json
      
      - name: Install dependencies
        working-directory: rider
        run: npm ci
      
      - name: Lint
        working-directory: rider
        env:
          EXPO_PUBLIC_AUTH0_DOMAIN: ci-test.auth0.com
          EXPO_PUBLIC_AUTH0_CLIENT_ID: ci-test-client-id
          EXPO_PUBLIC_API_URL: http://localhost:4000/api
        run: npm run lint
      
      - name: Type check
        working-directory: rider
        run: npx tsc --noEmit

  driver-lint:
    name: Driver App Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: driver/package-lock.json
      
      - name: Install dependencies
        working-directory: driver
        run: npm ci
      
      - name: Lint
        working-directory: driver
        env:
          EXPO_PUBLIC_AUTH0_DOMAIN: ci-test.auth0.com
          EXPO_PUBLIC_AUTH0_CLIENT_ID: ci-test-client-id
          EXPO_PUBLIC_API_URL: http://localhost:4000/api
        run: npm run lint
      
      - name: Type check
        working-directory: driver
        run: npx tsc --noEmit

  admin-lint:
    name: Admin Console Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      
      - name: Install dependencies
        working-directory: admin
        run: npm ci
      
      - name: Lint
        working-directory: admin
        run: npm run lint
      
      - name: Type check
        working-directory: admin
        run: npx tsc --noEmit
      
      - name: Build check
        working-directory: admin
        run: npm run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Audit rider dependencies
        working-directory: rider
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Audit driver dependencies
        working-directory: driver
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Audit admin dependencies
        working-directory: admin
        run: npm audit --audit-level=high
        continue-on-error: true
