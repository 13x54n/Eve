/**
 * @swagger
 * /api/driver/trips/{tripId}/offers:
 *   post:
 *     summary: Send fare offer for a trip
 *     tags: [Driver]
 *     security:
 *       - bearerAuth: []
 *     parameters:
 *       - in: path
 *         name: tripId
 *         required: true
 *         schema:
 *           type: string
 *     requestBody:
 *       required: true
 *       content:
 *         application/json:
 *           schema:
 *             type: object
 *             required:
 *               - proposedFare
 *               - etaMinutes
 *             properties:
 *               proposedFare:
 *                 type: number
 *                 example: 20.00
 *               etaMinutes:
 *                 type: integer
 *                 example: 5
 *     responses:
 *       201:
 *         description: Offer created
 *         content:
 *           application/json:
 *             schema:
 *               type: object
 *               properties:
 *                 offer:
 *                   $ref: '#/components/schemas/TripOffer'
 *       409:
 *         description: Already has pending offer or invalid fare
 */

