/**
 * @swagger
 * /api/rider/trips:
 *   post:
 *     summary: Create a new trip request
 *     tags: [Rider]
 *     security:
 *       - bearerAuth: []
 *     requestBody:
 *       required: true
 *       content:
 *         application/json:
 *           schema:
 *             type: object
 *             required:
 *               - pickupLat
 *               - pickupLng
 *               - dropoffLat
 *               - dropoffLng
 *               - vehicleType
 *             properties:
 *               pickupLat:
 *                 type: number
 *                 example: 40.7128
 *               pickupLng:
 *                 type: number
 *                 example: -74.0060
 *               dropoffLat:
 *                 type: number
 *                 example: 40.7580
 *               dropoffLng:
 *                 type: number
 *                 example: -73.9855
 *               vehicleType:
 *                 type: string
 *                 enum: [BIKE, CAR]
 *                 example: CAR
 *               pickupAddress:
 *                 type: string
 *               dropoffAddress:
 *                 type: string
 *     responses:
 *       201:
 *         description: Trip created successfully
 *         content:
 *           application/json:
 *             schema:
 *               type: object
 *               properties:
 *                 trip:
 *                   $ref: '#/components/schemas/Trip'
 *       400:
 *         description: Invalid request
 *         content:
 *           application/json:
 *             schema:
 *               $ref: '#/components/schemas/Error'
 *       409:
 *         description: Rider already has an active trip
 *         content:
 *           application/json:
 *             schema:
 *               $ref: '#/components/schemas/Error'
 *   get:
 *     summary: Get rider's trip history
 *     tags: [Rider]
 *     security:
 *       - bearerAuth: []
 *     responses:
 *       200:
 *         description: List of trips
 *         content:
 *           application/json:
 *             schema:
 *               type: object
 *               properties:
 *                 trips:
 *                   type: array
 *                   items:
 *                     $ref: '#/components/schemas/Trip'
 */

