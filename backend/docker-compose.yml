# Local split-stack: auth, location, ride, notify, admin.
# Usage (from backend/): docker compose up --build
# Compose loads backend/.env for ${DATABASE_URL} at build time.

x-dev-build: &dev-build
  context: .
  dockerfile: Dockerfile.dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: eve-postgres
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eve

  redis:
    image: redis:7-alpine
    container_name: eve-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - eve

  migrate:
    build: *dev-build
    container_name: eve-migrate
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "rm -rf packages/db/src/generated/prisma && npx prisma generate && npx prisma migrate deploy"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://eve:eve@postgres:5432/eve
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eve
    restart: "no"

  auth:
    build: *dev-build
    container_name: eve-auth
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -w @eve/auth
    env_file: .env
    environment:
      NODE_ENV: development
      AUTH_PORT: 4001
      DATABASE_URL: postgresql://eve:eve@postgres:5432/eve
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
    ports:
      - "4001:4001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - eve
    restart: unless-stopped

  location:
    build: *dev-build
    container_name: eve-location
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -w @eve/location
    env_file: .env
    environment:
      NODE_ENV: development
      LOCATION_PORT: 4002
      DATABASE_URL: postgresql://eve:eve@postgres:5432/eve
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOCATION_GRPC_PORT: 50051
      LOCATION_GRPC_URL: location:50051
    ports:
      - "4002:4002"
      - "50051:50051"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - eve
    restart: unless-stopped

  ride:
    build: *dev-build
    container_name: eve-ride
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -w @eve/ride
    env_file: .env
    environment:
      NODE_ENV: development
      RIDE_PORT: 4003
      DATABASE_URL: postgresql://eve:eve@postgres:5432/eve
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOCATION_GRPC_URL: location:50051
      NOTIFY_GRPC_URL: notify:50052
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_DRIVER_FOLDER: ${IMAGEKIT_DRIVER_FOLDER:-/eve/drivers}
    ports:
      - "4003:4003"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      location:
        condition: service_started
      notify:
        condition: service_started
    networks:
      - eve
    restart: unless-stopped

  notify:
    build: *dev-build
    container_name: eve-notify
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -w @eve/notify
    env_file: .env
    environment:
      NODE_ENV: development
      NOTIFY_PORT: 4004
      DATABASE_URL: postgresql://eve:eve@postgres:5432/eve
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      NOTIFY_GRPC_PORT: 50052
      NOTIFY_GRPC_URL: notify:50052
    ports:
      - "4004:4004"
      - "50052:50052"
    depends_on:
      migrate:
        condition: service_completed_successfully
      location:
        condition: service_started
    networks:
      - eve
    restart: unless-stopped

  admin:
    build: *dev-build
    container_name: eve-admin
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -w @eve/admin
    env_file: .env
    environment:
      NODE_ENV: development
      ADMIN_PORT: 4005
      DATABASE_URL: postgresql://eve:eve@postgres:5432/eve
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      LOCATION_GRPC_URL: location:50051
      NOTIFY_GRPC_URL: notify:50052
    ports:
      - "4005:4005"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      location:
        condition: service_started
      notify:
        condition: service_started
    networks:
      - eve
    restart: unless-stopped

networks:
  eve:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
